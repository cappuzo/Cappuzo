name: Build Cappuzo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Check Gradle
        run: gradle --version

      - name: Build APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cappuzo-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
